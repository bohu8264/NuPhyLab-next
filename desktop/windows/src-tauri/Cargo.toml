[package]
name = "nuphylab-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
serde.workspace = true
serde_json.workspace = true
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
nuphylab-core = { path = "../../../native/core" }
tauri-plugin-updater = {version="=2.10.1",default-features=false,features=["native-tls"]}
futures-util = "=0.3.34"
update-http = { package = "reqwest", version = "=0.13.5", default-features = false }
tempfile = "=3.27.0"
base64 = "=0.22.1"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
windows-sys = {version="=0.61.2",features=["Win32_Foundation","Win32_System_Threading","Win32_Security","Win32_System_Console","Win32_System_SystemInformation","Win32_UI_WindowsAndMessaging"]}

[dev-dependencies]
tempfile = "=3.27.0"
