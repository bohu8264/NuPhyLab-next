[package]
name = "nuphylab-hid"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nuphylab-desktop-io"
path = "src/desktop_io/main.rs"

[[bin]]
name = "nuphylab-agent-probe"
path = "src/agent_probe.rs"

[dependencies]
nuphylab-core = { path = "../core" }
serde_json.workspace = true
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_HumanInterfaceDevice"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Variant", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Media_Multimedia", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Power"] }

[dev-dependencies]
serde.workspace = true
tempfile = "=3.27.0"
