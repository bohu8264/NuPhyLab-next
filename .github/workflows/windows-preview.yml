name: Windows preview checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nuphylab'
      - '.gitattributes'
      - 'desktop/**'
      - 'native/core/**'
      - 'native/windows/**'
      - 'server/**'
      - 'shared/**'
      - 'ui/**'
      - 'scripts/windows/**'
      - 'scripts/fetch-sparkle.mjs'
      - 'tests/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.nvmrc'
      - 'package*.json'
      - '.cargo/**'
      - '.github/workflows/windows-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ui
          rustup show
          rustc --version
          node --version
      - name: Build shared interface
        run: npm run build:ui
      - name: Prepare preview sidecars
        run: npm run windows:prepare
      - name: Test preview contracts
        run: npm run windows:test
      - name: Check native warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The complete Node suite includes macOS native/legacy service fixtures
      # and runs in shared-macos; Windows uses its dedicated contracts above.
      - name: Build internal preview installer
        run: npm run windows:build
      - uses: actions/upload-artifact@v7
        with:
          name: NuPhyLab-Windows-x64-internal-preview
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
  shared-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install and check shared behavior
        run: |
          npm ci
          npm ci --prefix ui
          rustup show
          rustc --version
          node --version
          node --input-type=module -e "import {ensureSparkle} from './scripts/fetch-sparkle.mjs'; await ensureSparkle()"
          cargo build --locked -p nuphylab-hid
          cargo build --locked -p nuphylab-core --example lighting-simulator
          npm test
          npm run build:ui
          cargo clippy --locked --workspace --all-targets -- -D warnings
